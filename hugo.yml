#baseURL: https://yuanhes.com/
languageCode: en-us
title: "Yuanhe's Homepage" 
theme: PaperMod
pagination:
  pagerSize: 10 # number of posts showing on homepage
summaryLength: 80

enableInlineShortcodes: true
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
pygmentsUseClasses: true
#defaultContentLanguage: en
#defaultContentLanguageInSubdir: false
mermaid: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

params:
  profileMode:
    enabled: true
    title: "Yuanhe's Homepage" # optional default will be site title
    subtitle: ""
    imageUrl: "/apple-touch-icon.png" # optional
    imageTitle: "" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size
    buttons:
      - name: Posts
        url: "/posts"
      - name: About
        url: "/about"
      - name: Projects
        url: "/projects"
      - name: Links
        url: "/links"
  author: "Franz Song"
  env: production
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  displayFullLangName: true
  ShowRssButtonInSectionTermList: true
  #ShowAllPagesInArchive: true
  ShowPageNums: true
  comments: true
  DateFormat: "2006/01/02"
  #ShowToc: true
  #TocOpen: true
  #ShowLanguageSwitcher: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
  assets:
    disableHLJS: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  homeInfoParams:
    Title: Welcome to my Homepage!
    Content: Here should be a short intro ... 
  socialIcons: # optional
    - name: "GitHub"
      url: "https://github.com/yuanhes"
    - name: "Linkedin"
      url: "https://www.linkedin.com/in/yuanhe-song"
    - name: "GoogleScholar"
      url: "https://scholar.google.com/citations?hl=en&user=hfmkBOEAAAAJ"
    - name: "Email"
      url: "mailto:justsyh@gmail.com"
  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

taxonomies:
  category: categories
  tag: tags

module:
  mounts:
    - source: static
      target: static
    - source: images
      target: static/images

#languages:
#  en:
#    languageName: ":us:EN"
#    weight: 1
#  zh:
#    languageName: ":cn:中文"
#    weight: 2
#    title: 元和的个人网站

menus:
  main:
    #- identifier: home
    #  name: Home
    #  pageRef: /
    #  weight: 10
    #- identifier: posts
    #  name: Posts
    #  pageRef: /posts
    #  weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    #- identifier: categories
    #  name: Categories
    #  url: /categories/
    #  weight: 25
    #- identifier: tags
    #  name: Tags
    #  url: /tags/
    #  weight: 25
    - identifier: about
      name: About
      pageRef: /about
      weight: 30
    - identifier: search
      name: Search
      pageRef: /search
      weight: 50

services:
  disqus:
    shortname: yuanhes
  googleAnalytics:
    id: G-GXPSD54DME

privacy:
  googleAnalytics:
    disable: false
    respectDoNotTrack: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: monokailight
